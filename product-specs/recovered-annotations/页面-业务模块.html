<!doctype html>
<!--
  ===== 组件小纸条（真前端照此套 isdream-vue-admin / Element Plus 组件）=====
  这块地 = 业务模块管理（材料/候选人/公告/归档，四合一，?module=切换）。
  2026-07-14 产品边界纠偏：
  - 材料管理只负责公众自荐报名：选岗位、交岗位要求材料、后台审核、通过后进入候选人池。
  - 归档管理才是本届各类文件的综合目录树：母版阶段文件、报名人材料、业务档案、照片和其他文件。
  - 两者可通过 sourceType/sourceId/fileRef 贸易，但材料管理绝不是全站附件库。
  - 归档阶段文件夹按 electionId+stageKey 和母版阶段名自动生成；历史届只读。
  - 第一公理：一个母版/一届 electionId 只有一个归档根目录，其他模块全部映射进该届，禁止重复选届、手建目录或二次上传。
  皮：美化版红金(Noto Serif SC + Noto Sans SC · #B22222/#C8A45C · 宣纸底 #FAF8F5)。

  ⚠️ 关键血缘：材料审核通过 → 生成候选人记录 → 回写 materials.candidate_id
  ⚠️ 母版驱动：候选人阶段操作按 elections.content.timeline + 当天日期计算，不手填

  [面包屑]              → el-breadcrumb，separator="/"
  [届次/状态筛选]        → el-form :inline + el-select + el-button type="primary"/"default"

  [历届活动列表]         → el-table :data="activities" stripe；
                           状态 → el-tag：进行中 type="danger"，已归档 type="info"；
                           操作 → el-button：本届 type="primary"「进入管理」/ 历届 plain「查看明细」

  [母版时间轴（详情顶部）] → 横排8格 el-steps :active="currentStage"，可点击跳转（候选人模块）

  [材料审核明细]         → el-table；
                           完整度 → el-progress type="line" :percentage="..."；
                           状态 → el-tag；
                           操作：el-button「预览」/ type="danger"「驳回」/ type="primary"「通过并生成候选人」；
                           接口：POST materials/review → { pass:true|false }；通过后回写 candidate_id

  [候选人池]             → el-table；
                           阶段操作按钮随 currentStage 动态渲染：
                             S1-2: 「通过资格审查」+ type="danger"「驳回」；
                             S3: 「确认入围」+「取消资格」；
                             S5-7: 「回填线下结果」；
                             历届: 只「查看」；
                           接口：POST candidate-v2/qualify | confirm | freeze | result-backfill

  [公告存档（只读）]     → el-table，只读镜像，按 electionId+stageKey 聚合；
                           「预览」→ el-dialog内嵌 PDF；「下载 PDF」→ a :href download；
                           入口按钮跳母版：location.href = motherUrl(stageKey)

  [归档目录树（只读）]   → el-tree :data="folderTree"；节点只支持下载，不支持上传；
                           接口：GET materials/list?electionId=&scope=archive
  ==========================================================================
-->

h:100%;height:38px;border:1px solid var(--line);border-radius:5px;padding:0 10px;background:#fff}.panel{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h3{margin:0;font-size:17px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th{background:#f4eee8;color:#5f5752;font-size:12px;text-align:left;padding:12px 14px;white-space:nowrap}.table td{padding:14px;border-top:1px solid #eee8e1;vertical-align:middle}.table tr:hover td{background:#fffaf6}.status{display:inline-block;padding:4px 9px;border-radius:4px;font-size:12px;font-weight:700}.status.run{background:#fbe5e2;color:var(--red)}.status.done{background:#eeeae6;color:#68615c}.status.wait{background:#fff2cb;color:#7e5e00}.status.pass{background:#e1f2e7;color:var(--green)}.route{min-width:126px}.pager{padding:14px 18px;border-top:1px solid var(--line);color:var(--muted)}.hidden{display:none!important}

<body>
<div class="app">
  <main class="main">
    <div class="topbar"><div class="context"><span>归属地<strong>涧口社区</strong></span><span>角色<strong>经办</strong></span><span>账号<strong>150****0000</strong></span></div><span class="online">● 在线</span></div>
    <nav class="mobile-nav"><a data-module="materials" href="?module=materials">材料</a><a data-module="candidates" href="?module=candidates">候选人</a><a data-module="notices" href="?module=notices">公告</a><a data-module="archives" href="?module=archives">归档</a></nav>
    <div class="content">
      <div id="listView">
        <div class="crumb"><button onclick="location.href='村长仪表盘-美化版.html'">首页工作台</button> / <span id="crumbModule"></span> / <span id="crumbList"></span></div>
        <div class="heading"><div><h2 id="pageTitle"></h2><p>按具体换届活动下钻，本期可办理，历届只读。</p></div><button class="btn" onclick="location.href='页面-活动总列表.html'">查看母活动</button></div>
        <div class="filters"><div class="field"><label>届次</label><select><option>全部届次</option><option>第十五届</option><option>第十四届</option><option>第十三届</option></select></div><div class="field"><label>年份</label><select><option>全部年份</option><option>2026</option><option>2021</option><option>2018</option></select></div><div class="field"><label>状态</label><select><option>全部状态</option><option>进行中</option><option>已归档</option></select></div><button class="btn primary" onclick="toast('筛选已应用')">查询</button></div>
        <section class="panel"><div class="panel-head"><h3 id="listTitle"></h3><span>共 3 届</span></div><div class="table-wrap"><table class="table"><thead><tr><th>届次</th><th>关联活动</th><th id="metricHead"></th><th>状态</th><th>操作</th></tr></thead><tbody id="activityRows"></tbody></table></div><div class="pager">共 3 条　‹　1　›</div></section>
      </div>
      <div id="detailView" class="hidden">
        <div class="crumb"><button onclick="showList()">返回历届列表</button> / <span id="detailCrumb"></span></div>
        <div class="heading"><div><h2 id="detailTitle"></h2><p id="detailSubtitle"></p></div><button class="btn" onclick="showList()">返回列表</button></div>
        <section class="mother"><div class="mother-top"><div><h3 id="motherName"></h3><p>居民直接选举 · electionId <span id="motherId"></span> · 当前第 18 天</p></div><span id="motherStatus" class="status run"></span></div><div class="timeline" id="timeline"></div></section>
        <div id="readonlyTip" class="readonly hidden">该届已归档，仅供查看和下载；新增、编辑、审核、删除操作已隐藏。</div>

<script>
const moduleKey=new URLSearchParams(location.search).get('module')||'materials';
const modules={
  materials:{name:'材料提交管理',list:'历届材料记录',detail:'材料审核明细',metric:'材料记录',counts:['12份 · 3待审','18份','15份']},
  candidates:{name:'候选人管理',list:'历届候选人名录',detail:'候选人审批管理',metric:'候选人数',counts:['8人 · 3待审','7人','6人']},
  notices:{name:'公告通知',list:'历届公告记录',detail:'阶段公告列表',metric:'公告数量',counts:['4条已发','18条','16条']},
  archives:{name:'历史归档',list:'历届活动列表',detail:'文件夹目录树',metric:'归档文件',counts:['6份','42份','38份']}
};
const activities=[
  {id:1,session:'第十五届',year:2026,name:'第15届涧口社区居委会换届选举',readonly:false,status:'进行中'},
  {id:2,session:'第十四届',year:2021,name:'第14届涧口社区居委会换届选举',readonly:true,status:'已归档'},
  {id:3,session:'第十三届',year:2018,name:'第13届涧口社区居委会换届选举',readonly:true,status:'已归档'}
];
const stages=['准备','选民登记','提名候选人','正式候选人公示','竞选活动','投票选举','结果公示','归档移交'];
let currentActivity=null;
let currentStage=2;
function init(){
  const cfg=modules[moduleKey]||modules.materials;
  document.title=cfg.name+' · 城厢区换届选举';
  document.getElementById('crumbModule').textContent=cfg.name;document.getElementById('crumbList').textContent=cfg.list;
  document.getElementById('pageTitle').textContent=cfg.list;document.getElementById('listTitle').textContent=cfg.list+'（本期 + 历届）';document.getElementById('metricHead').textContent=cfg.metric;
  document.querySelectorAll('[data-module]').forEach(a=>a.classList.toggle('active',a.dataset.module===moduleKey));
  document.getElementById('activityRows').innerHTML=activities.map((a,i)=>`<tr><td><strong>${a.session}</strong><div class="source">${a.year}</div></td><td><strong>${a.name}</strong><div class="source">electionId ${a.id}</div></td><td>${cfg.counts[i]}</td><td><span class="status ${a.readonly?'done':'run'}">${a.status}</span></td><td><button class="btn ${a.readonly?'':'primary'} route" onclick="showDetail(${a.id})">${a.readonly?'查看明细':'进入管理'}</button></td></tr>`).join('');
}
function showDetail(id){
  currentActivity=activities.find(a=>a.id===id);const cfg=modules[moduleKey];
  document.getElementById('listView').classList.add('hidden');document.getElementById('detailView').classList.remove('hidden');
  document.getElementById('detailCrumb').textContent=currentActivity.session+cfg.detail;document.getElementById('detailTitle').textContent=currentActivity.session+cfg.detail;
  document.getElementById('detailSubtitle').textContent=currentActivity.readonly?'历史届只读明细':'当前活动可办理事项';document.getElementById('motherName').textContent=currentActivity.name;
  document.getElementById('motherId').textContent=currentActivity.id;document.getElementById('motherStatus').textContent=currentActivity.readonly?'已归档':'提名候选人阶段';
  document.getElementById('motherStatus').className='status '+(currentActivity.readonly?'done':'run');document.getElementById('readonlyTip').classList.toggle('hidden',!currentActivity.readonly);
  renderStageTimeline();
  document.getElementById('moduleDetail').innerHTML=renderDetail(moduleKey,currentActivity.readonly);window.scrollTo(0,0);
}
function showList(){document.getElementById('detailView').classList.add('hidden');document.getElementById('listView').classList.remove('hidden');window.scrollTo(0,0)}
function renderStageTimeline(){
  const clickable=moduleKey==='candidates'&&!currentActivity.readonly;
  document.getElementById('timeline').innerHTML=stages.map((s,i)=>`<div class="stage ${currentActivity.readonly||i<currentStage?'done':i===currentStage?'current':''}" ${clickable?`onclick="setCurrentStage(${i})" style="cursor:pointer"`:''}>${i+1}. ${s}<span>S${i+1}</span></div>`).join('');
}
function setCurrentStage(index){currentStage=index;renderStageTimeline();document.getElementById('motherStatus').textContent=stages[index]+'阶段';document.getElementById('moduleDetail').innerHTML=renderCandidates(false)}
function motherUrl(stageKey){const p=new URLSearchParams({electionId:String(currentActivity.id),electionName:currentActivity.name,villageName:'涧口',townName:'华亭镇',orgType:'community'});if(stageKey)p.set('stageKey',stageKey);if(currentActivity.readonly)p.set('readonly','1');return '选举系统_填空模板 (1).html?'+p.toString()}
function renderDetail(key,readonly){if(key==='materials')return renderMaterials(readonly);if(key==='candidates')return renderCandidates(readonly);if(key==='notices')return renderNotices();return renderArchives()}
function renderMaterials(readonly){
  // ── 候选人两个来源字段要统一（材料提交 vs 后台导入）──
  // 自荐来源：materials → POST materials/review(通过) → 自动生成 candidates 记录
  //   materials.id      → candidates.material_id（血缘回写）
  //   materials.name    → candidates.name
  //   materials.position_id → candidates.position_id
  //   materials.election_id → candidates.election_id
  //   candidates.source = 'material_submit'
  // 导入来源：后台直接 POST candidate-v2/import
  //   candidates.material_id = null
  //   candidates.source = 'import'
  // 两种来源的 candidates 表字段完全相同，source 字段区分。
  return `
  <div class="filters">
    <div class="field"><label>参选形式</label><select><option>全部</option><option>个人自荐</option><option>群众联名推荐</option></select></div>
    <div class="field"><label>竞选岗位</label><select><option>全部</option><option>主任</option><option>副主任</option><option>委员</option></select></div>
    <button class="btn primary" onclick="toast('筛选已应用')">查询</button>
  </div>
  <div class="sync-note">
    <strong>血缘关口：</strong>点【同意】→ 材料转为候选人记录，写入 candidates 表并回写 <span class="blood">materials.candidate_id</span>；同意后不可撤销。
    候选人池 = 自荐材料同意 + 后台导入，两种来源字段完全统一，仅 <span class="blood">source</span> 字段不同。
  </div>
  <section class="panel">
    <div class="panel-head"><h3>第 ${currentActivity.session} 材料审核明细</h3><span class="source">electionId ${currentActivity.id}</span></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>#</th><th>提交人</th><th>竞选岗位</th><th>参选形式</th><th>材料预览</th><th>是否进入候选人池</th><th>操作</th></tr></thead>
      <tbody>
        <tr id="material1">
          <td>1</td>
          <td><strong>李秀兰</strong><div class="source">materialId 31 · 138****2108 · 2026-07-05</div></td>
          <td>主任 <div class="source">positionId 11</div></td>
          <td>个人自荐</td>
          <td><button class="btn" onclick="toast('演示：弹出材料附件预览')">预览材料</button></td>
          <td><span class="status wait material-status">待审核</span></td>
          <td><div class="detail-actions">
            ${readonly?'<button class="btn" onclick="toast('只读模式')">查看</button>':`
            <button class="btn danger" onclick="reviewMaterial(false)">✗ 驳回</button>
            <button class="btn primary" onclick="reviewMaterial(true)">✓ 同意入池</button>
            `}
          </div></td>
        </tr>
        <tr>
          <td>2</td>
          <td><strong>陈晓梅</strong><div class="source">materialId 32 · 137****5566 · 2026-07-06</div></td>
          <td>委员 <div class="source">positionId 13</div></td>
          <td>群众联名推荐</td>
          <td><button class="btn" onclick="toast('演示：弹出材料附件预览')">预览材料</button></td>
          <td><span class="status wait">材料待补充</span></td>
          <td><button class="btn" onclick="toast('材料不齐，待补充后方可审核')">查看</button></td>
        </tr>
        <tr>
          <td>3</td>
          <td><strong>王建明</strong><div class="source">materialId 33 · 2026-07-07</div></td>
          <td>副主任 <div class="source">positionId 12</div></td>
          <td>党组织推荐</td>
          <td><button class="btn" onclick="toast('演示：弹出材料附件预览')">预览材料</button></td>
          <td><span class="status pass">已进入候选人池 <small>→ candidateId 102</small></span></td>
          <td><button class="btn" onclick="toast('已同意，候选人记录已生成')">查看记录</button></td>
        </tr>
      </tbody>
    </table></div>
    <div class="pager">共 3 条　‹　1　›</div>
  </section>
  <div class="folder-tree" style="font-size:12px;padding:10px 16px;background:#fff7df;border:1px solid #ead28b;margin-top:12px;border-radius:6px;">
    <strong>字段对照（材料自荐 vs 后台导入，candidates 表字段统一）：</strong><br>
    materials.name → candidates.name &nbsp;|&nbsp;
    materials.position_id → candidates.position_id &nbsp;|&nbsp;
    candidates.source: <span class="blood">'material_submit'</span> 或 <span class="blood">'import'</span> &nbsp;|&nbsp;
    candidates.material_id: 自荐时有值，导入时 null
  </div>
  `
}
function reviewMaterial(pass){const row=document.getElementById('material1');const status=row.querySelector('.material-status');status.className='status '+(pass?'pass':'done');status.textContent=pass?'已通过 · 候选人#101':'已驳回';row.querySelector('.detail-actions').innerHTML='<button class="btn">查看审核记录</button>';toast(pass?'已生成候选人记录，并回写材料血缘':'材料已驳回')}
function candidateAction(readonly,stage,frozen){
  if(readonly||frozen) return '<button class="btn">查看</button>';
  if(stage==='nominated')  return '<button class="btn primary" onclick="qualifyCandidate(this)">✓ 通过资格审查</button> <button class="btn danger" onclick="freezeCandidate(this)">✗ 驳回冻结</button>';
  if(stage==='qualified')  return '<button class="btn primary" onclick="confirmCandidate(this)">✓ 确认入围</button> <button class="btn danger" onclick="freezeCandidate(this)">取消资格</button>';
  if(stage==='final')      return '<span class="source">最终竞选阶段，等待选举日结果回填</span>';
  return '<span class="source">—</span>';
}
function renderCandidates(readonly){
  // 候选人三阶段漏斗：提名（nominated） → 正式候选（qualified） → 最终竞选（final）
  // 冻结（frozen=true）：被淘汰/驳回，本届不再出现在后续勾选口
  // 来源字段：candidates.source = 'material_submit' | 'import'
  //           candidates.material_id = 有值（自荐）| null（导入）
  var funnel = [
    {id:101, name:'李秀兰', pos:'主任', posId:11, form:'个人自荐',   source:'material_submit', matId:31,  stage:'nominated',  frozen:false},
    {id:102, name:'陈建民', pos:'副主任',posId:12, form:'党组织推荐',source:'import',           matId:null, stage:'qualified',  frozen:false},
    {id:103, name:'王秀芬', pos:'委员',  posId:13, form:'群众联名推荐',source:'material_submit',matId:32,  stage:'final',      frozen:false},
    {id:104, name:'林国强', pos:'委员',  posId:13, form:'个人自荐',   source:'material_submit', matId:33,  stage:'nominated',  frozen:true},
  ];
  var rows = funnel.map(function(c,i){
    var stageLabel = {nominated:'提名阶段',qualified:'正式候选',final:'最终竞选'}[c.stage]||c.stage;
    var stageCls   = {nominated:'wait',qualified:'run',final:'pass'}[c.stage]||'';
    var srcLabel   = c.source==='material_submit'
      ? 'materialId '+c.matId+' → candidateId '+c.id
      : '后台导入';
    var frozenBadge = c.frozen ? ' <span class="status done">已冻结</span>' : '';
    return '<tr style="'+(c.frozen?'opacity:.5':'')+'">'+
      '<td>'+(i+1)+'</td>'+
      '<td><strong>'+c.name+'</strong><div class="source">candidateId '+c.id+'</div></td>'+
      '<td>'+c.pos+'<div class="source">positionId '+c.posId+'</div></td>'+
      '<td>'+c.form+'</td>'+
      '<td><span class="source">'+srcLabel+'</span></td>'+
      '<td><span class="status '+stageCls+'" id="cstage'+c.id+'">'+stageLabel+'</span>'+frozenBadge+'</td>'+
      '<td>'+candidateAction(readonly,c.stage,c.frozen)+'</td>'+
    '</tr>';
  }).join('');
  return `
  <div class="sync-note">
    <strong>三阶段漏斗：</strong>提名 → 资格审查通过 → 正式候选 → 竞选演讲差额预选 → 最终竞选 → 选举日结果回填。<br>
    被冻结候选人本届不再显示勾选操作；来源统一：<span class="blood">material_submit</span>（自荐材料同意）或 <span class="blood">import</span>（后台导入），字段完全相同。
  </div>
  <section class="panel">
    <div class="panel-head">
      <h3>候选人池 <span class="source">（提名+正式+最终竞选三阶段横排）</span></h3>
      ${readonly?'':'<button class="btn gold" onclick="toast(\'后台导入候选人 → POST candidate-v2/import，source=import，material_id=null\')">↑ 导入候选人</button>'}
    </div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>#</th><th>姓名</th><th>竞选岗位</th><th>参选形式</th><th>来源（血缘）</th><th>当前阶段</th><th>阶段操作</th></tr></thead>
      <tbody id="candRows">${rows}</tbody>
    </table></div>
    <div class="pager">共 ${funnel.length} 人（含冻结 1 人）　‹ 1 ›</div>
  </section>
  <div class="folder-tree" style="font-size:12px;padding:10px 16px;background:#fff7df;border:1px solid #ead28b;margin-top:12px;border-radius:6px;">
    <strong>candidates 表字段（两种来源统一）：</strong>
    id | election_id | position_id | name | source('material_submit'|'import') |
    material_id(int|null) | stage('nominated'|'qualified'|'final') |
    frozen(bool) | created_at<br>
    操作接口：POST candidate-v2/qualify | confirm | freeze | result-backfill
  </div>`;
}
function qualifyCandidate(btn){
  var tr=btn.closest('tr');
  tr.querySelector('[id^="cstage"]').className='status run';
  tr.querySelector('[id^="cstage"]').textContent='正式候选';
  btn.parentElement.innerHTML='<button class="btn primary" onclick="confirmCandidate(this)">✓ 确认入围</button> <button class="btn danger" onclick="freezeCandidate(this)">取消资格</button>';
  toast('资格审查通过 → 进入正式候选阶段');
}
function confirmCandidate(btn){
  var tr=btn.closest('tr');
  tr.querySelector('[id^="cstage"]').className='status pass';
  tr.querySelector('[id^="cstage"]').textContent='最终竞选';
  btn.parentElement.innerHTML='<span class="source">等待选举日结果回填</span>';
  toast('已确认入围 → 进入最终竞选阶段');
}
function freezeCandidate(btn){
  var tr=btn.closest('tr');
  tr.style.opacity='0.5';
  tr.querySelector('[id^="cstage"]').innerHTML+=' <span class="status done">已冻结</span>';
  btn.parentElement.innerHTML='<button class="btn">查看</button>';
  toast('已冻结 → 本届不再显示审批操作');
}

let toastTimer;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
init();
