<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城厢区村居换届选举系统 - UI设计稿展示</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .border-l-3 { border-left-width: 3px; }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ============ PhoneFrame ============ */
    function PhoneFrame({ title, children }) {
      return (
        <div className="flex flex-col items-center gap-3">
          <h3 className="text-sm font-semibold text-gray-900">{title}</h3>
          <div className="relative w-[280px] h-[560px] bg-gray-900 rounded-[2.5rem] p-2 shadow-2xl border border-gray-700">
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-6 bg-gray-900 rounded-b-2xl z-10" />
            <div className="w-full h-full bg-white rounded-[2rem] overflow-hidden relative">
              {children}
            </div>
          </div>
        </div>
      );
    }

    /* ============ BrowserFrame ============ */
    function BrowserFrame({ title, children }) {
      return (
        <div className="flex flex-col items-center gap-3">
          <h3 className="text-sm font-semibold text-gray-900">{title}</h3>
          <div className="w-[640px] h-[440px] bg-white rounded-lg shadow-2xl border border-gray-200 overflow-hidden flex flex-col">
            <div className="flex items-center gap-2 px-3 py-2 bg-gray-100 border-b border-gray-200 shrink-0">
              <div className="flex gap-1.5">
                <div className="w-3 h-3 rounded-full bg-red-400" />
                <div className="w-3 h-3 rounded-full bg-yellow-400" />
                <div className="w-3 h-3 rounded-full bg-green-400" />
              </div>
              <div className="flex-1 ml-3 px-3 py-1 bg-white rounded-md text-xs text-gray-400 border border-gray-200">
                https://cxq-election.gov.cn/admin
              </div>
            </div>
            <div className="flex-1 overflow-auto">
              {children}
            </div>
          </div>
        </div>
      );
    }

    /* ============ PC Sidebar & TopBar ============ */
    const SIDEBAR_ITEMS = [
      '首页概览', '公告管理', '选举管理', '职位管理', '候选人管理',
      '材料管理', '通知管理', '档案管理', '管理员设置', '角色设置',
    ];

    function Sidebar({ active }) {
      return (
        <div className="w-36 bg-white border-r border-gray-200 py-2 shrink-0">
          {SIDEBAR_ITEMS.map((name) => (
            <div key={name} className={`px-3 py-1.5 text-[9px] cursor-pointer ${
              name === active ? 'bg-teal-50 text-teal-600 font-bold border-r-2 border-teal-600' : 'text-gray-600'
            }`}>{name}</div>
          ))}
        </div>
      );
    }

    function TopBar() {
      return (
        <div className="flex items-center justify-between px-4 py-2 bg-white border-b border-gray-200">
          <div className="flex items-center gap-2">
            <div className="w-6 h-6 bg-teal-600 rounded flex items-center justify-center">
              <span className="text-white text-[8px] font-bold">选</span>
            </div>
            <span className="text-[10px] font-bold text-gray-700">城厢区村居换届选举管理系统</span>
          </div>
          <div className="flex items-center gap-2">
            <span className="text-[9px] text-gray-500">管理员</span>
            <div className="w-5 h-5 bg-gray-200 rounded-full cursor-pointer" />
          </div>
        </div>
      );
    }

    /* ============ Mini: NoticeDetailModal ============ */
    function NoticeDetailModal({ notice, onClose }) {
      return (
        <div className="absolute inset-0 z-50 bg-black/50 flex items-end">
          <div className="w-full bg-white rounded-t-2xl max-h-[90%] flex flex-col">
            <div className="shrink-0 px-3 pt-3 pb-2 border-b border-gray-100">
              <div className="flex items-center justify-between">
                <span className="text-[10px] text-gray-400">公告详情</span>
                <button onClick={onClose} className="w-5 h-5 bg-gray-100 rounded-full flex items-center justify-center">
                  <span className="text-[9px] text-gray-500">✕</span>
                </button>
              </div>
              <h2 className="text-xs font-bold text-gray-800 mt-1.5 leading-snug">{notice.title}</h2>
            </div>
            <div className="flex-1 overflow-auto px-3 py-2.5 space-y-3">
              <div className="bg-amber-50 border border-amber-200 rounded-lg p-2.5">
                <div className="flex items-center justify-between mb-1.5">
                  <div className="text-[9px] text-gray-500">⏰ 参选时间</div>
                  <span className="text-[8px] text-amber-600 font-bold bg-amber-100 px-1.5 py-0.5 rounded">⚠ 请在有效期内提交材料</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <div className="bg-white border border-amber-200 rounded px-2 py-1">
                    <div className="text-[8px] text-gray-400">起始时间</div>
                    <div className="text-[10px] font-bold text-amber-700">{notice.startTime}</div>
                  </div>
                  <span className="text-amber-400 text-[10px]">→</span>
                  <div className="bg-white border border-amber-200 rounded px-2 py-1">
                    <div className="text-[8px] text-gray-400">截止时间</div>
                    <div className="text-[10px] font-bold text-amber-700">{notice.endTime}</div>
                  </div>
                </div>
                <div className="text-[8px] text-amber-600 mt-1.5 flex items-center gap-0.5">
                  <span>⚠️</span>
                  <span className="font-medium">参选截止时间以公告为准，逾期将无法提交材料</span>
                </div>
              </div>
              <div className="bg-gray-50 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-gray-700 mb-1.5">📄 公告正文</div>
                <div className="text-[9px] text-gray-600 leading-relaxed whitespace-pre-line">{notice.content}</div>
              </div>
              <div className="bg-amber-50 border border-amber-200 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-amber-800 mb-2">📖 {notice.guide.title}</div>
                <div className="w-full h-28 bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 rounded-lg flex flex-col items-center justify-center mb-2.5 border border-amber-200">
                  <div className="text-2xl mb-1">📋</div>
                  <div className="text-[9px] text-gray-500 font-medium">参选流程示意图</div>
                  <div className="flex items-center gap-1 mt-1.5">
                    {['选民登记', '→', '资格审核', '→', '领取选票', '→', '投票选举'].map((step, i) => (
                      <span key={i} className={`text-[7px] ${step === '→' ? 'text-amber-400' : 'bg-amber-200 text-amber-800 px-1 py-0.5 rounded'}`}>{step}</span>
                    ))}
                  </div>
                </div>
                <div className="space-y-1.5">
                  {notice.guide.steps.map((step, i) => (
                    <div key={i} className="flex items-start gap-2">
                      <div className="w-4 h-4 rounded-full bg-amber-500 text-white text-[8px] flex items-center justify-center shrink-0 mt-0.5">{i + 1}</div>
                      <span className="text-[9px] text-gray-700 leading-relaxed">{step}</span>
                    </div>
                  ))}
                </div>
                {notice.guide.tips.length > 0 && (
                  <div className="mt-2.5 bg-white/70 rounded p-2">
                    <div className="text-[9px] font-bold text-amber-700 mb-1">💡 温馨提示</div>
                    {notice.guide.tips.map((tip, i) => (
                      <div key={i} className="text-[8px] text-amber-700 leading-relaxed">• {tip}</div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <div className="shrink-0 px-3 pt-2 pb-1">
              <button className="w-full bg-teal-600 text-white text-[10px] py-2.5 rounded-lg font-bold flex items-center justify-center gap-1.5 shadow-sm">
                <span>📋</span><span>快捷提交材料</span><span className="text-[8px] opacity-80">→ 前往材料提交</span>
              </button>
              <div className="text-[7px] text-slate-400 mt-1 text-center font-medium">可点击「快捷提交材料」跳转到材料提交页面</div>
            </div>
            <div className="shrink-0 px-3 py-2 border-t border-gray-100">
              <button onClick={onClose} className="w-full bg-teal-600 text-white text-[10px] py-2 rounded-lg font-medium">我已知晓</button>
            </div>
          </div>
        </div>
      );
    }

    /* ============ Mini: ForecastDetailModal ============ */
    function ForecastDetailModal({ forecast, onClose }) {
      return (
        <div className="absolute inset-0 z-50 bg-black/50 flex items-end">
          <div className="w-full bg-white rounded-t-2xl max-h-[85%] flex flex-col">
            <div className="shrink-0 px-3 pt-3 pb-2 border-b border-gray-100">
              <div className="flex items-center justify-between">
                <span className="text-[10px] text-teal-600 font-bold">🔔 选举预告详情</span>
                <button onClick={onClose} className="w-5 h-5 bg-gray-100 rounded-full flex items-center justify-center">
                  <span className="text-[9px] text-gray-500">✕</span>
                </button>
              </div>
              <h2 className="text-xs font-bold text-gray-800 mt-1.5 leading-snug">{forecast.title}</h2>
            </div>
            <div className="flex-1 overflow-auto px-3 py-2.5 space-y-2.5">
              <div className="bg-amber-50 border border-amber-100 rounded-lg p-2.5">
                <div className="text-[9px] text-gray-500 mb-1">📅 选举时间</div>
                <div className="text-sm font-bold text-amber-700">{forecast.date}</div>
                <div className="text-[10px] text-amber-600 mt-0.5">{forecast.timeRange}</div>
              </div>
              <div className="bg-gray-50 rounded-lg p-2.5">
                <div className="text-[9px] text-gray-500 mb-1">📍 选举地点</div>
                <div className="text-[10px] text-gray-700">{forecast.location}</div>
              </div>
              <div className="bg-blue-50 border border-blue-100 rounded-lg p-2.5">
                <div className="text-[9px] text-gray-500 mb-1.5">🎯 竞选职位</div>
                <div className="flex flex-wrap gap-1.5">
                  {forecast.positions.map((pos) => (
                    <span key={pos} className="text-[9px] bg-white border border-blue-200 text-blue-700 px-2 py-1 rounded-full font-medium">{pos}</span>
                  ))}
                </div>
              </div>
              <div className="bg-amber-50 border border-amber-100 rounded-lg p-2.5">
                <div className="text-[9px] font-bold text-amber-700 mb-1">⚠️ 注意事项</div>
                <div className="text-[9px] text-amber-700 leading-relaxed">{forecast.notes}</div>
              </div>
              <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-emerald-800 mb-2">📊 选举活动流程图</div>
                <div className="w-full h-32 bg-gradient-to-br from-emerald-100 via-teal-50 to-cyan-50 rounded-lg flex flex-col items-center justify-center mb-2 border border-emerald-200">
                  <div className="text-2xl mb-1">🏛️</div>
                  <div className="text-[9px] text-gray-500 font-medium">选举活动流程示意图</div>
                  <div className="flex items-center gap-0.5 mt-2 flex-wrap justify-center px-2">
                    {['成立选举委员会', '→', '选民登记', '→', '候选人提名', '→', '公示审核', '→', '投票选举', '→', '公布结果'].map((step, i) => (
                      <span key={i} className={`text-[6px] ${step === '→' ? 'text-emerald-400' : 'bg-emerald-200 text-emerald-800 px-1 py-0.5 rounded'}`}>{step}</span>
                    ))}
                  </div>
                </div>
              </div>
              <div className="bg-indigo-50 border border-indigo-100 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-indigo-800 mb-2">📝 投票步骤指引</div>
                <div className="space-y-1.5">
                  {['携带本人身份证和选民证前往指定投票站', '在入口处核验身份，领取空白选票', '进入秘密写票处，在选票上勾选支持的候选人（可多选）', '将填写好的选票投入票箱', '如需委托投票，须提前3日办理委托手续，每人最多接受3人委托', '投票结束后，在监票人监督下公开计票'].map((step, i) => (
                    <div key={i} className="flex items-start gap-2">
                      <div className="w-4 h-4 rounded-full bg-indigo-500 text-white text-[8px] flex items-center justify-center shrink-0 mt-0.5">{i + 1}</div>
                      <span className="text-[9px] text-gray-700 leading-relaxed">{step}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="bg-gray-50 border border-gray-200 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-gray-700 mb-2">📎 相关附件</div>
                <div className="space-y-1.5">
                  {[{ name: '选举工作实施方案.pdf', size: '2.3 MB' }, { name: '投票站分布图.png', size: '856 KB' }, { name: '委托投票申请表.docx', size: '128 KB' }].map((file, i) => (
                    <div key={i} className="flex items-center gap-2 bg-white rounded-md px-2 py-1.5 border border-gray-100">
                      <span className="text-sm">📄</span>
                      <div className="flex-1 min-w-0">
                        <div className="text-[9px] text-gray-700 font-medium truncate">{file.name}</div>
                        <div className="text-[8px] text-gray-400">{file.size}</div>
                      </div>
                      <span className="text-[9px] text-teal-600 font-medium shrink-0">下载</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="shrink-0 px-3 py-2 border-t border-gray-100">
              <button onClick={onClose} className="w-full bg-slate-600 text-white text-[10px] py-2 rounded-lg font-medium">关闭</button>
            </div>
          </div>
        </div>
      );
    }

    /* ============ Mini: HistoryDetailModal ============ */
    function HistoryDetailModal({ history, onClose }) {
      return (
        <div className="absolute inset-0 z-50 bg-black/50 flex items-end">
          <div className="w-full bg-white rounded-t-2xl max-h-[90%] flex flex-col">
            <div className="shrink-0 px-3 pt-3 pb-2 border-b border-gray-100">
              <div className="flex items-center justify-between">
                <span className="text-[10px] text-gray-400">历史公示详情</span>
                <button onClick={onClose} className="w-5 h-5 bg-gray-100 rounded-full flex items-center justify-center">
                  <span className="text-[9px] text-gray-500">✕</span>
                </button>
              </div>
              <h2 className="text-xs font-bold text-gray-800 mt-1.5 leading-snug">{history.title}</h2>
            </div>
            <div className="flex-1 overflow-auto px-3 py-2.5 space-y-3">
              <div className="bg-slate-50 border border-slate-200 rounded-lg p-2.5">
                <div className="text-[9px] text-gray-500 mb-1.5">📅 发布日期</div>
                <div className="flex items-center gap-1.5">
                  <div className="bg-white border border-slate-200 rounded px-2 py-1">
                    <div className="text-[8px] text-gray-400">公示期</div>
                    <div className="text-[10px] font-bold text-slate-700">{history.publishRange}</div>
                  </div>
                  <div className="bg-white border border-slate-200 rounded px-2 py-1">
                    <div className="text-[8px] text-gray-400">状态</div>
                    <div className="text-[10px] font-bold text-slate-700">{history.status}</div>
                  </div>
                </div>
              </div>
              <div className="bg-gray-50 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-gray-700 mb-1.5">📄 正文内容</div>
                <div className="text-[9px] text-gray-600 leading-relaxed whitespace-pre-line">{history.content}</div>
              </div>
              <div className="bg-amber-50 border border-amber-200 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-amber-800 mb-2">📖 图文明细</div>
                <div className="w-full h-24 bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 rounded-lg flex flex-col items-center justify-center mb-2.5 border border-amber-200">
                  <div className="text-2xl mb-1">📊</div>
                  <div className="text-[9px] text-gray-500 font-medium">选举结果公示示意图</div>
                </div>
                <div className="text-[9px] text-gray-700 leading-relaxed mb-2.5">{history.detailText}</div>
                {history.electedMembers.length > 0 && (
                  <div className="bg-white/70 rounded-md p-2">
                    <div className="text-[9px] font-bold text-amber-800 mb-1.5">🏆 当选人员</div>
                    <div className="space-y-1">
                      {history.electedMembers.map((member, i) => (
                        <div key={i} className="flex items-center justify-between bg-white rounded px-2 py-1 border border-amber-100">
                          <div className="flex items-center gap-1.5">
                            <div className="w-4 h-4 rounded-full bg-amber-200 text-amber-700 text-[7px] flex items-center justify-center font-bold">{i + 1}</div>
                            <span className="text-[9px] font-medium text-gray-700">{member.name}</span>
                            <span className="text-[8px] bg-teal-50 text-teal-600 px-1 py-0.5 rounded">{member.position}</span>
                          </div>
                          <span className="text-[8px] text-gray-500">{member.votes}票</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                <div className="mt-2 grid grid-cols-2 gap-2">
                  <div className="bg-white/70 rounded-md p-2 text-center">
                    <div className="text-[8px] text-gray-400">参选率</div>
                    <div className="text-sm font-bold text-teal-600">{history.participationRate}</div>
                  </div>
                  <div className="bg-white/70 rounded-md p-2 text-center">
                    <div className="text-[8px] text-gray-400">参选人数</div>
                    <div className="text-sm font-bold text-teal-600">{history.totalVoters}</div>
                  </div>
                </div>
              </div>
            </div>
            <div className="shrink-0 px-3 py-2 border-t border-gray-100">
              <button onClick={onClose} className="w-full bg-slate-600 text-white text-[10px] py-2 rounded-lg font-medium">关闭</button>
            </div>
          </div>
        </div>
      );
    }

    /* ============ Mini: CandidateDetailModal ============ */
    function CandidateDetailModal({ candidate, onClose }) {
      return (
        <div className="absolute inset-0 z-50 bg-black/50 flex items-end">
          <div className="w-full bg-white rounded-t-2xl max-h-[90%] flex flex-col">
            <div className="shrink-0 px-3 pt-3 pb-2 border-b border-gray-100">
              <div className="flex items-center justify-between">
                <span className="text-[10px] text-gray-400">候选人详情</span>
                <button onClick={onClose} className="w-5 h-5 bg-gray-100 rounded-full flex items-center justify-center">
                  <span className="text-[9px] text-gray-500">✕</span>
                </button>
              </div>
            </div>
            <div className="flex-1 overflow-auto px-3 py-2.5 space-y-3">
              <div className="flex flex-col items-center py-2">
                <div className="w-16 h-16 rounded-full bg-gradient-to-br from-teal-400 to-slate-400 flex items-center justify-center mb-2">
                  <span className="text-white text-xl font-bold">{candidate.name[0]}</span>
                </div>
                <div className="text-sm font-bold text-gray-800">{candidate.name}</div>
                <span className="text-[9px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full mt-1">{candidate.position}</span>
              </div>
              <div className="bg-gray-50 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-gray-700 mb-2">📋 基本信息</div>
                <div className="grid grid-cols-2 gap-y-1.5 gap-x-3">
                  {[['性别', candidate.gender], ['年龄', candidate.age + '岁'], ['党派', candidate.party], ['学历', candidate.education], ['民族', candidate.ethnicity], ['社区', candidate.village]].map(([label, val], i) => (
                    <div key={i} className="flex items-center gap-1.5">
                      <span className="text-[9px] text-gray-400">{label}</span>
                      <span className="text-[9px] text-gray-700 font-medium">{val}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="bg-teal-50 border border-teal-100 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-teal-700 mb-1.5">🎯 竞选纲领</div>
                <div className="text-[9px] text-gray-700 leading-relaxed">{candidate.platform}</div>
              </div>
              <div className="bg-blue-50 border border-blue-100 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-blue-700 mb-1.5">📘 个人履历</div>
                <div className="text-[9px] text-gray-700 leading-relaxed">{candidate.career}</div>
              </div>
              <div className="bg-amber-50 border border-amber-100 rounded-lg p-2.5">
                <div className="text-[10px] font-bold text-amber-700 mb-1.5">🤝 承诺事项</div>
                <div className="space-y-1.5">
                  {candidate.pledges.map((pledge, i) => (
                    <div key={i} className="flex items-start gap-2">
                      <div className="w-4 h-4 rounded-full bg-amber-500 text-white text-[8px] flex items-center justify-center shrink-0 mt-0.5">{i + 1}</div>
                      <span className="text-[9px] text-gray-700 leading-relaxed">{pledge}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="shrink-0 px-3 py-2 border-t border-gray-100">
              <button onClick={onClose} className="w-full bg-slate-600 text-white text-[10px] py-2 rounded-lg font-medium">关闭</button>
            </div>
          </div>
        </div>
      );
    }

    /* ============ Mini: 首页 ============ */
    function MiniHomePage() {
